      - region [ref=f7e194]:
        - heading "What Walrus said this week" [level=2] [ref=f7e195]
        - list [ref=f7e196]:
          - listitem [ref=f7e197]:
            - paragraph [ref=f7e198]: Everyone shipped AI memory in October, but who actually owns it? Memory you cannot take with you is storage rented from one vendor.
            - link "Walrus, 5 Nov, paraphrased" [ref=f7e199] [cursor=pointer]:
              - /url: https://www.walrus.xyz/blog
          - listitem [ref=f7e203]:
            - paragraph [ref=f7e204]: A good assistant remembers what you said. A great one shows where it heard it.
            - link "Walrus, 8 Nov, paraphrased" [ref=f7e205] [cursor=pointer]:
              - /url: https://x.com/WalrusProtocol
          - listitem [ref=f7e209]:
            - paragraph [ref=f7e210]: Agents need context that stays current, not decisions that went out of date.
            - link "Walrus, 4 Nov, paraphrased" [ref=f7e211] [cursor=pointer]:
              - /url: https://x.com/WalrusProtocol
      - region [ref=f7e215]:
        - heading "What Ferry can and cannot promise" [level=2] [ref=f7e216]
        - generic [ref=f7e217]:
          - paragraph [ref=f7e218]: "Standard mode: the hosted Walrus Memory relayer encrypts and stores your facts, but it sees the text while it processes them. That is convenient, and it is not end to end encryption. Vault mode: your browser creates the search embeddings and encrypts each fact with Seal before anything leaves this device, so the relayer never sees the text. It still sees the encrypted vectors, your account owner address, the namespace and when you search."
          - paragraph [ref=f7e219]: "Forget means hidden: Ferry writes a tombstone so no device inserts the fact again. Walrus Memory has no delete, so the encrypted copy stays in Walrus storage until its storage epoch ends. Ferry shows you that epoch."
