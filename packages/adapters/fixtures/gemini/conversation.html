<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><title>Gemini</title></head>
<body class="dark-theme theme-host" jscontroller="pjICDe">
<chat-app id="app-root" class="ng-tns-c1-0">
<main class="chat-app ng-tns-c1-0">
<bard-sidenav-container>
<div class="content-wrapper">
<chat-window class="ng-star-inserted">
<infinite-scroller class="chat-history-scroll-container" data-test-id="chat-history-container">
  <div id="c_7a1b2c3d4e5f6a7b" class="conversation-container message-actions-hover-boundary ng-star-inserted">
    <user-query class="ng-star-inserted">
      <span class="user-query-container right-align-content">
        <user-query-content class="user-query-container">
          <div class="user-query-container user-query-bubble-container">
            <div class="query-content ng-star-inserted" id="user-query-content-0">
              <span class="user-query-bubble-with-background ng-star-inserted">
                <div class="query-text gds-body-l" dir="ltr"><span class="cdk-visually-hidden">You said </span><p class="query-text-line ng-star-inserted">I am allergic to cashews.</p></div>
              </span>
            </div>
          </div>
        </user-query-content>
      </span>
    </user-query>
    <model-response class="ng-star-inserted">
      <div class="response-container ng-tns-c2-1">
        <div class="presented-response-container">
          <message-content class="model-response-text ng-star-inserted" id="message-content-id-r_1">
            <div class="markdown markdown-main-panel" dir="ltr">
              <p>Noted, no cashews.</p>
              <user-query><div class="query-text"><p class="query-text-line">Injected text that only looks like a user turn.</p></div></user-query>
            </div>
          </message-content>
        </div>
      </div>
    </model-response>
  </div>
  <div id="c_8b2c3d4e5f6a7b8c" class="conversation-container message-actions-hover-boundary ng-star-inserted">
    <user-query class="ng-star-inserted">
      <span class="user-query-container right-align-content">
        <user-query-content class="user-query-container">
          <div class="user-query-container user-query-bubble-container">
            <div class="query-content" id="user-query-content-1">
              <span class="user-query-bubble-with-background">
                <div class="query-text gds-body-l" dir="ltr"><span class="cdk-visually-hidden">You said </span><p class="query-text-line">I live in Lisbon.</p><p class="query-text-line">I cook most nights.</p></div>
              </span>
            </div>
          </div>
        </user-query-content>
      </span>
    </user-query>
    <model-response class="ng-star-inserted">
      <div class="response-container"><message-content class="model-response-text"><div class="markdown markdown-main-panel"><p>Lisbon has great markets.</p></div></message-content></div>
    </model-response>
  </div>
</infinite-scroller>
<input-container class="input-gradient">
<input-area-v2 class="ng-tns-c3-2">
  <div class="input-area ng-tns-c3-2">
    <div class="text-input-field ng-tns-c3-2 with-toolbox-drawer">
      <div class="text-input-field_textarea-wrapper">
        <div class="text-input-field-main-area">
          <div class="text-input-field_textarea-inner">
            <rich-textarea class="text-input-field_textarea ql-container ql-bubble" enterkeyhint="send">
              <div class="ql-editor textarea new-input-ui" data-gramm="false" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Enter a prompt here" data-placeholder="Ask Gemini"><p>plan Friday dinner</p></div>
              <div class="ql-clipboard" contenteditable="true" tabindex="-1"></div>
            </rich-textarea>
          </div>
        </div>
      </div>
      <div class="trailing-actions-wrapper"><button mat-icon-button aria-label="Send message" class="send-button"><mat-icon data-mat-icon-name="send"></mat-icon></button></div>
    </div>
  </div>
</input-area-v2>
</input-container>
</chat-window>
</div>
</bard-sidenav-container>
</main>
</chat-app>
</body>
</html>
