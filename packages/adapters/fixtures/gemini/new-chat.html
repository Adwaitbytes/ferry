<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><title>Gemini</title></head>
<body class="light-theme theme-host">
<chat-app id="app-root">
<main class="chat-app">
<chat-window>
<infinite-scroller class="chat-history-scroll-container" data-test-id="chat-history-container"></infinite-scroller>
<input-area-v2>
  <div class="input-area">
    <rich-textarea class="text-input-field_textarea ql-container ql-bubble" enterkeyhint="send">
      <div class="ql-editor ql-blank textarea new-input-ui" data-gramm="false" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Enter a prompt here" data-placeholder="Ask Gemini"><p><br></p></div>
    </rich-textarea>
  </div>
</input-area-v2>
</chat-window>
</main>
</chat-app>
</body>
</html>
